<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8EFEA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5F3ED" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sandstoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFD7CB" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#EBE5DC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DFD7CB" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="shaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2D0C8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D4E0DA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#B8C8BF" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="crossBedding" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 L40 0 M20 40 L60 0" stroke="#8C8B88" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="shaleLaminae" width="80" height="15" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="35" y2="5" stroke="#46735E" stroke-width="0.75" stroke-opacity="0.3"/>
      <line x1="45" y1="5" x2="80" y2="5" stroke="#46735E" stroke-width="0.75" stroke-opacity="0.3"/>
      <line x1="15" y1="12" x2="65" y2="12" stroke="#46735E" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Upper Mountainous Outcrop Crest -->
  <path d="M0 240 Q320 180 640 220 T1280 190 Q1600 240 1920 180 L1920 1080 L0 1080 Z" fill="#F1ECE4"/>

  <!-- Stratum 1: Weathered Siltstone Bedding -->
  <path d="M0 310 Q400 260 850 300 T1600 270 Q1780 290 1920 260 L1920 390 Q1500 370 1000 410 T0 380 Z" fill="url(#shaleGrad)"/>
  <path d="M0 310 Q400 260 850 300 T1600 270 Q1780 290 1920 260 L1920 390 Q1500 370 1000 410 T0 380 Z" fill="url(#shaleLaminae)"/>

  <!-- Stratum 2: Massive Cross-Bedded Sandstone Formation -->
  <path d="M0 380 Q500 410 1000 370 T1920 390 L1920 560 Q1400 520 800 570 T0 540 Z" fill="url(#sandstoneGrad)"/>
  <path d="M0 380 Q500 410 1000 370 T1920 390 L1920 560 Q1400 520 800 570 T0 540 Z" fill="url(#crossBedding)"/>

  <!-- Stratum 3: Fine Argillaceous Shale Layer -->
  <path d="M0 540 Q600 570 1200 530 T1920 560 L1920 680 Q1300 640 700 690 T0 660 Z" fill="#D9E4DD" fill-opacity="0.7"/>
  <path d="M0 540 Q600 570 1200 530 T1920 560 L1920 680 Q1300 640 700 690 T0 660 Z" fill="url(#shaleLaminae)"/>

  <!-- Stratum 4: Lower Conglomeratic Sandstone Unit -->
  <path d="M0 660 Q700 690 1300 640 T1920 680 L1920 860 Q1200 810 600 870 T0 840 Z" fill="#E5DFD5" fill-opacity="0.85"/>
  <path d="M0 660 Q700 690 1300 640 T1920 680 L1920 860 Q1200 810 600 870 T0 840 Z" fill="url(#crossBedding)"/>

  <!-- Stratum 5: Basal Competent Strata -->
  <path d="M0 840 Q600 870 1200 810 T1920 860 L1920 1080 L0 1080 Z" fill="#D0DDD5" fill-opacity="0.8"/>

  <!-- Geological Structural Joint Lines (Subtle Tectonic Fractures) -->
  <line x1="420" y1="280" x2="380" y2="720" stroke="#7A9485" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="12 4"/>
  <line x1="880" y1="320" x2="840" y2="790" stroke="#7A9485" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="14 4"/>
  <line x1="1450" y1="250" x2="1410" y2="760" stroke="#7A9485" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="10 3"/>

  <!-- Stratigraphic Bedding Trace Contours -->
  <path d="M0 450 Q480 430 960 460 T1920 440" stroke="#8C8B88" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M0 610 Q520 630 1040 590 T1920 620" stroke="#5C8F77" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M0 750 Q460 730 920 760 T1920 740" stroke="#8C8B88" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
</svg>
